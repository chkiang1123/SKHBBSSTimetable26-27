<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Offline Free Slot Finder</title>

      background-color: #121826;
      color: #e2e8f0;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      border: 1px solid #334155;
    }
    h2 {
      margin-top: 0;
      color: #60a5fa;
      font-size: 1.4rem;
    }
    .search-box {
      margin-bottom: 10px;
    }
    .search-box input {
      width: 100%;
      max-width: 380px;
      padding: 8px 12px;
      background-color: #0f172a;
      border: 1px solid #475569;
      color: #f8fafc;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }
    .search-box input:focus {
      border-color: #3b82f6;
    }
    .teacher-boxes {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 6px;
      background: #0f172a;
    }
    .teacher-label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      color: #cbd5e1;
    }
    .teacher-label:hover {
      background: #334155;
      color: #fff;
    }
    .controls {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }
    button.secondary {
      padding: 6px 14px;
      background-color: #334155;
      color: #e2e8f0;
      border: 1px solid #475569;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    button.secondary:hover {
      background-color: #475569;
      color: #fff;
    }
    .status-summary {
      margin-top: 15px;
      font-weight: 600;
      color: #93c5fd;
    }
    .table-responsive {
      overflow-x: auto;
      margin-top: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }
    th, td {
      border: 1px solid #334155;
      padding: 10px;
      text-align: center;
      font-size: 13px;
    }
    th {
      background-color: #1e40af;
      color: #ffffff;
    }
    td.period-header {
      background-color: #0f172a;
      color: #94a3b8;
      font-weight: bold;
    }
    .free-slot {
      background-color: #064e3b;
      color: #6ee7b7;
      font-weight: bold;
    }
    .busy-slot {
      background-color: #7f1d1d;
      color: #fca5a5;
    }

    /* Timeslot Lookup Panel */
    .lookup-card {
      background: #0f172a;
      border: 1px solid #3b82f6;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .lookup-card h3 {
      margin-top: 0;
      margin-bottom: 12px;
      color: #60a5fa;
      font-size: 1.1rem;
    }
    .lookup-controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 15px;
    }
    .lookup-controls select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .lookup-results {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
    }
    .category-group {
      margin-bottom: 10px;
    }
    .category-group:last-child {
      margin-bottom: 0;
    }
    .category-title {
      font-weight: bold;
      color: #f59e0b;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .category-title.normal {
      color: #34d399;
    }

      flex-wrap: wrap;
      gap: 6px;
    }

      background: #0f172a;
      border: 1px solid #475569;
      color: #e2e8f0;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
    }

      color: #fef08a;
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- Timeslot Lookup Engine -->
  <div class="lookup-card">
    <h3>Find Available Teachers by Timeslot</h3>
    <div class="lookup-controls">
      <label>
        Select Day:
        <select id="lookupDay" onchange="runTimeslotLookup()">
          <option value="1">Day 1</option>
          <option value="2">Day 2</option>
          <option value="3" selected>Day 3</option>
          <option value="4">Day 4</option>
          <option value="5">Day 5</option>
          <option value="6">Day 6</option>
        </select>
      </label>
      <label>
        Select Period:
        <select id="lookupPeriod" onchange="runTimeslotLookup()">
          <option value="1">Period 1</option>
          <option value="2">Period 2</option>
          <option value="3">Period 3</option>
          <option value="4">Period 4</option>
          <option value="5">Period 5</option>
          <option value="6" selected>Period 6</option>
          <option value="7">Period 7</option>
          <option value="8">Period 8</option>
          <option value="9">Period 9</option>
        </select>
      </label>
    </div>

    <div class="lookup-results">
      <div id="lookupHeader" style="font-weight: bold; margin-bottom: 10px; color: #93c5fd;"></div>
      
      <div class="category-group">
        <div class="category-title normal">Normal Teachers:</div>
        <div id="normalTeacherList" class="teacher-tag-list"></div>
      </div>
      
      <div class="category-group" style="margin-top: 12px;">
        <div class="category-title">Student Guidance and Discipline Services Teachers:</div>
        <div id="sgdsTeacherList" class="teacher-tag-list"></div>
      </div>
    </div>
  </div>

  <h2>Teacher Free Time Slot Checker (Selected Teachers Overlap)</h2>
  
  <div class="search-box">
    <input type="text" id="teacherSearch" placeholder="Filter teacher name or code..." onkeyup="filterTeachers()">
  </div>

  <div class="selection-area">
    <div id="teacherBoxes" class="teacher-boxes"></div>
    <div class="controls">
      <button class="secondary" onclick="selectAll(false)">Clear Selection</button>
    </div>
  </div>

  <div id="statusSummary" class="status-summary">Selected: CCW (Cheung Chi Wai), KCH (Kiang Chi Hong)</div>

  <div class="table-responsive">
    <table id="timetableGrid">
      <thead>
        <tr>

          <th>Day 1</th>
          <th>Day 2</th>
          <th>Day 3</th>
          <th>Day 4</th>
          <th>Day 5</th>
          <th>Day 6</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

    label.setAttribute('data-teacher', teacher);
    label.setAttribute('data-fullname', teacherNames[teacher] || '');
    const isChecked = (teacher === 'CCW' || teacher === 'KCH') ? 'checked' : '';
    label.innerHTML = `<input type="checkbox" value="${teacher}" onchange="updateTimetable()" ${isChecked}> ${getTeacherDisplayName(teacher)}`;
    container.appendChild(label);
  });
}

function filterTeachers() {
  const query = document.getElementById('teacherSearch').value.toUpperCase().trim();
  const labels = document.querySelectorAll('#teacherBoxes .teacher-label');
  labels.forEach(label => {
    const code = label.getAttribute('data-teacher').toUpperCase();
    const name = label.getAttribute('data-fullname').toUpperCase();
    label.style.display = (code.includes(query) || name.includes(query)) ? 'flex' : 'none';
  });
}

function selectAll(checked) {
  const checkboxes = document.querySelectorAll('#teacherBoxes input[type="checkbox"]');
  checkboxes.forEach(cb => cb.checked = checked);
  updateTimetable();
}

function updateTimetable() {
  const selectedTeachers = Array.from(document.querySelectorAll('#teacherBoxes input[type="checkbox"]:checked')).map(cb => cb.value);
  const summaryDiv = document.getElementById('statusSummary');
  
  if (selectedTeachers.length === 0) {
    summaryDiv.textContent = 'No teachers selected. Select teachers above to find free overlapping slots.';
  } else {
    summaryDiv.textContent = `Comparing (${selectedTeachers.length}) teachers: ` + selectedTeachers.map(getTeacherDisplayName).join(', ');
  }

  const tbody = document.querySelector('#timetableGrid tbody');
  tbody.innerHTML = '';

  for (let period = 1; period <= 9; period++) {
    const row = document.createElement('tr');
    let rowHTML = `<td class="period-header">Period ${period}</td>`;

    for (let day = 1; day <= 6; day++) {
      if (selectedTeachers.length === 0) {
        rowHTML += `<td>-</td>`;
        continue;
      }

      const isFree = selectedTeachers.every(teacher => {
        const busyPeriods = scheduleData[teacher][day] || [];
        return !busyPeriods.includes(period);
      });

      if (isFree) {
        rowHTML += `<td class="free-slot">FREE</td>`;
      } else {
        rowHTML += `<td class="busy-slot">BUSY</td>`;
      }
    }
    row.innerHTML = rowHTML;
    tbody.appendChild(row);
  }
}

// Searching Engine: Find free teachers for selected Day & Period
function runTimeslotLookup() {
  const day = parseInt(document.getElementById('lookupDay').value);
  const period = parseInt(document.getElementById('lookupPeriod').value);

  const freeNormal = [];
  const freeSGDS = [];

  teachers.forEach(teacher => {
    const busyPeriods = scheduleData[teacher][day] || [];
    if (!busyPeriods.includes(period)) {
      if (sgdsSet.has(teacher)) {
        freeSGDS.push(teacher);
      } else {
        freeNormal.push(teacher);
      }
    }
  });

  document.getElementById('lookupHeader').textContent = `Day ${day} Period ${period} (Free Teachers)`;

  const normalContainer = document.getElementById('normalTeacherList');
  if (freeNormal.length > 0) {
    normalContainer.innerHTML = freeNormal.map(t => `<span class="teacher-tag">${getTeacherDisplayName(t)}</span>`).join('');
  } else {
    normalContainer.innerHTML = `<span style="font-size:12px; color:#94a3b8;">None</span>`;
  }

  const sgdsContainer = document.getElementById('sgdsTeacherList');
  if (freeSGDS.length > 0) {
    sgdsContainer.innerHTML = freeSGDS.map(t => `<span class="teacher-tag sgds">${getTeacherDisplayName(t)}</span>`).join('');
  } else {
    sgdsContainer.innerHTML = `<span style="font-size:12px; color:#94a3b8;">None</span>`;
  }
}

// Initial setup
renderTeacherChoices();
updateTimetable();
runTimeslotLookup();
</script>
