<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Free Period Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #21262d;
  --bg-card: #161b22;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #484f58;
  --accent: #58a6ff;
  --accent-dim: #388bfd;
  --accent-glow: rgba(88, 166, 255, 0.12);
  --green: #3fb950;
  --green-dim: rgba(63, 185, 80, 0.15);
  --border: #30363d;
  --danger: #f85149;
  --warning: #d29922;
  --warning-glow: rgba(210, 153, 34, 0.12);
  --free-cell: rgba(63, 185, 80, 0.12);
  --busy-cell: rgba(248, 81, 73, 0.06);
  --highlight: rgba(63, 185, 80, 0.22);
  --shadow: 0 3px 12px rgba(0,0,0,0.3);
  --radius: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans TC', -apple-system, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  padding: 16px;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
}

header {
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

h1 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 4px;
}

h1 span { color: var(--accent); }

.subtitle {
  color: var(--text-muted);
  font-size: 0.8rem;
  font-family: 'JetBrains Mono', monospace;
}

.section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
}

.section-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

/* Tabs */
.tabs {
  display: flex;
  gap: 2px;
  margin-bottom: 16px;
  background: var(--bg-secondary);
  padding: 3px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
}

.tab {
  flex: 1;
  padding: 9px 12px;
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--text-muted);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.tab.active {
  background: var(--accent);
  color: #fff;
}

.tab:hover:not(.active) {
  color: var(--text-primary);
  background: var(--bg-tertiary);
}

.tab-content { display: none; }
.tab-content.active { display: block; }

/* Teacher Search */
.teacher-select-wrapper { position: relative; }

.teacher-search {
  width: 100%;
  padding: 10px 14px;
  font-size: 16px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-primary);
  font-family: 'Noto Sans TC', sans-serif;
  outline: none;
  transition: border-color 0.15s;
}

.teacher-search:focus { border-color: var(--accent); }
.teacher-search::placeholder { color: var(--text-muted); }

.teacher-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
  min-height: 28px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--accent-glow);
  border: 1px solid var(--accent-dim);
  color: var(--accent);
  padding: 3px 10px;
  border-radius: 16px;
  font-size: 0.78rem;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
  animation: chipIn 0.15s ease;
}

@keyframes chipIn {
  from { transform: scale(0.85); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.chip .remove {
  cursor: pointer;
  font-size: 0.95rem;
  line-height: 1;
  opacity: 0.7;
  transition: opacity 0.15s;
}

.chip .remove:hover { opacity: 1; color: var(--danger); }

.dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-top: 4px;
  max-height: 220px;
  overflow-y: auto;
  z-index: 100;
  display: none;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}

.dropdown.show { display: block; }

.dropdown-item {
  padding: 8px 14px;
  cursor: pointer;
  font-size: 0.82rem;
  transition: background 0.1s;
  border-bottom: 1px solid rgba(48, 54, 61, 0.5);
}

.dropdown-item:last-child { border-bottom: none; }
.dropdown-item:hover { background: var(--accent-glow); }

.dropdown-item .short {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  color: var(--accent);
  margin-right: 6px;
}

.dropdown-item .name { color: var(--text-secondary); }

/* Slot Search */
.slot-search {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

.slot-search select {
  padding: 9px 12px;
  font-size: 16px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-primary);
  font-family: 'JetBrains Mono', monospace;
  outline: none;
  cursor: pointer;
}

.slot-search select:focus { border-color: var(--accent); }

.btn {
  padding: 9px 16px;
  font-size: 0.82rem;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
}

.btn-primary {
  background: var(--accent);
  color: #fff;
}

.btn-primary:hover { background: var(--accent-dim); }

/* Timetable */
.timetable-wrapper {
  overflow-x: auto;
  margin-top: 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
}

.timetable {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.75rem;
  min-width: 520px;
}

.timetable th {
  background: var(--bg-tertiary);
  padding: 8px 6px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
  font-size: 0.72rem;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  white-space: nowrap;
}

.timetable td {
  padding: 6px 5px;
  border: 1px solid var(--border);
  text-align: center;
  vertical-align: middle;
  font-size: 0.7rem;
  line-height: 1.3;
  min-width: 70px;
}

.timetable td.free {
  background: var(--free-cell);
  color: var(--green);
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
}

.timetable td.busy {
  background: var(--busy-cell);
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
}

.timetable td.busy .teacher-loc {
  display: block;
  color: var(--danger);
  opacity: 0.8;
  font-size: 0.65rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 120px;
  margin: 0 auto;
}

.timetable tr th:first-child {
  position: sticky;
  left: 0;
  z-index: 2;
  background: var(--bg-tertiary);
}

/* Results */
.results {
  margin-top: 14px;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.results-header {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  color: var(--green);
  margin-bottom: 14px;
  font-weight: 700;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.results-category { margin-bottom: 14px; }

.results-category-label {
  font-size: 0.72rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  font-family: 'JetBrains Mono', monospace;
}

.results-teachers {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.teacher-tag {
  display: inline-block;
  padding: 4px 9px;
  border-radius: 5px;
  font-size: 0.75rem;
  font-family: 'JetBrains Mono', monospace;
}

.teacher-tag.normal {
  background: var(--green-dim);
  border: 1px solid rgba(63, 185, 80, 0.3);
  color: var(--green);
}

.teacher-tag.sgds {
  background: var(--warning-glow);
  border: 1px solid rgba(210, 153, 34, 0.3);
  color: var(--warning);
}

.no-results {
  color: var(--text-muted);
  font-style: italic;
  font-size: 0.82rem;
}

.legend {
  display: flex;
  gap: 16px;
  margin-top: 10px;
  font-size: 0.72rem;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-secondary);
  flex-wrap: wrap;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
}

.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 3px;
}

.legend-dot.free-dot { background: var(--green); opacity: 0.7; }
.legend-dot.busy-dot { background: var(--danger); opacity: 0.4; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-secondary); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* Responsive */
@media (max-width: 600px) {
  body { padding: 10px; }
  h1 { font-size: 1.2rem; }
  .section { padding: 12px; }
  .slot-search { flex-direction: column; align-items: stretch; }
  .slot-search select { width: 100%; }
  .btn { width: 100%; text-align: center; }
  .tabs { overflow-x: auto; }
  .tab { font-size: 0.72rem; padding: 8px 10px; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1><span>//</span> Teacher Free Period Finder</h1>
    <p class="subtitle">26-27 Timetable &middot; 6 Days &middot; 9 Periods &middot; 58 Teachers</p>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="common">Common Free Periods</div>
    <div class="tab" data-tab="slot">Search by Time Slot</div>
  </div>

  <!-- Tab 1: Common Free Periods -->
  <div class="tab-content active" id="tab-common">
    <div class="section">
      <div class="section-title">Select Teachers</div>
      <div class="teacher-select-wrapper">
        <input type="text" class="teacher-search" id="teacherSearch" placeholder="Search by short name, English name, or Chinese name..." autocomplete="off">
        <div class="dropdown" id="teacherDropdown"></div>
      </div>
      <div class="teacher-chips" id="selectedChips"></div>
    </div>

    <div class="section" id="commonResults" style="display:none;">
      <div class="section-title">Timetable Comparison</div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot free-dot"></div> All Free</div>
        <div class="legend-item"><div class="legend-dot busy-dot"></div> Busy (class shown)</div>
      </div>
      <div class="timetable-wrapper">
        <table class="timetable" id="commonTable"></table>
      </div>
    </div>
  </div>

  <!-- Tab 2: Search by Time Slot -->
  <div class="tab-content" id="tab-slot">
    <div class="section">
      <div class="section-title">Select Time Slot</div>
      <div class="slot-search">
        <select id="daySelect">
          <option value="">Day</option>
          <option value="1">Day 1</option>
          <option value="2">Day 2</option>
          <option value="3">Day 3</option>
          <option value="4">Day 4</option>
          <option value="5">Day 5</option>
          <option value="6">Day 6</option>
        </select>
        <select id="periodSelect">
          <option value="">Period</option>
          <option value="1">Period 1</option>
          <option value="2">Period 2</option>
          <option value="3">Period 3</option>
          <option value="4">Period 4</option>
          <option value="5">Period 5</option>
          <option value="6">Period 6</option>
          <option value="7">Period 7</option>
          <option value="8">Period 8</option>
          <option value="9">Period 9</option>
        </select>
        <button class="btn btn-primary" id="searchSlotBtn">Search</button>
      </div>
    </div>

    <div class="section" id="slotResults" style="display:none;">
      <div id="slotResultsContent"></div>
    </div>
  </div>
</div>

// Student Guidance and Discipline Services teachers
const SGDS_TEACHERS = ['CTK','CMB','MSM','CHC','SWP','KCH','FPY','CLH','LSY','TWF','YSP','LCW','HYL','CLI'];

// ==================== APP LOGIC ====================
let selectedTeachers = [];

function isFree(teacher, day, period) {
  return !teacher.b[day + '_' + period];
}

function getBusyClass(teacher, day, period) {
  return teacher.b[day + '_' + period] || null;
}

// ==================== TABS ====================
document.querySelectorAll('.tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.tab-content').forEach(function(tc) { tc.classList.remove('active'); });
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
  });
});

// ==================== TEACHER SEARCH ====================
var searchInput = document.getElementById('teacherSearch');
var dropdown = document.getElementById('teacherDropdown');
var chipsContainer = document.getElementById('selectedChips');

searchInput.addEventListener('focus', showDropdown);
searchInput.addEventListener('input', showDropdown);

document.addEventListener('click', function(e) {
  if (!e.target.closest('.teacher-select-wrapper')) {
    dropdown.classList.remove('show');
  }
});

function showDropdown() {
  var query = searchInput.value.toLowerCase().trim();
  var filtered = TEACHERS.filter(function(t) {
    if (selectedTeachers.indexOf(t.s) !== -1) return false;
    if (!query) return true;
    return t.s.toLowerCase().indexOf(query) !== -1 ||
           t.e.toLowerCase().indexOf(query) !== -1 ||
           t.c.indexOf(query) !== -1;
  });

  if (filtered.length === 0) {
    dropdown.innerHTML = '<div class="dropdown-item"><span class="name">No match</span></div>';
  } else {
    dropdown.innerHTML = filtered.map(function(t) {
      return '<div class="dropdown-item" data-short="' + t.s + '">' +
        '<span class="short">' + t.s + '</span>' +
        '<span class="name">' + t.e + (t.c ? ' ' + t.c : '') + '</span></div>';
    }).join('');
  }

  dropdown.classList.add('show');
  dropdown.querySelectorAll('.dropdown-item[data-short]').forEach(function(item) {
    item.addEventListener('click', function() {
      addTeacher(item.dataset.short);
    });
  });
}

function addTeacher(shortName) {
  if (selectedTeachers.indexOf(shortName) !== -1) return;
  selectedTeachers.push(shortName);
  searchInput.value = '';
  dropdown.classList.remove('show');
  renderChips();
  updateCommonFree();
}

function removeTeacher(shortName) {
  selectedTeachers = selectedTeachers.filter(function(s) { return s !== shortName; });
  renderChips();
  updateCommonFree();
}

function renderChips() {
  chipsContainer.innerHTML = selectedTeachers.map(function(s) {
    var t = TEACHERS.find(function(x) { return x.s === s; });
    return '<div class="chip"><span>' + t.s + '</span><span class="remove" onclick="removeTeacher(\'' + t.s + '\')">&times;</span></div>';
  }).join('');
}

function updateCommonFree() {
  var resultsSection = document.getElementById('commonResults');
  var table = document.getElementById('commonTable');

  if (selectedTeachers.length === 0) {
    resultsSection.style.display = 'none';
    return;
  }

  resultsSection.style.display = 'block';
  var teachers = selectedTeachers.map(function(s) {
    return TEACHERS.find(function(x) { return x.s === s; });
  });

  // Build table: Days as columns, Periods as rows
  var html = '<thead><tr><th></th>';
  for (var d = 1; d <= 6; d++) {
    html += '<th>Day ' + d + '</th>';
  }
  html += '</tr></thead><tbody>';

  for (var p = 1; p <= 9; p++) {
    html += '<tr><th>P' + p + '</th>';
    for (var dd = 1; dd <= 6; dd++) {
      var allFree = teachers.every(function(t) { return isFree(t, dd, p); });
      if (allFree) {
        html += '<td class="free">FREE</td>';
      } else {
        var details = teachers.map(function(t) {
          var cls = getBusyClass(t, dd, p);
          if (cls) {
            return '<span class="teacher-loc">' + t.s + ': ' + cls + '</span>';
          }
          return null;
        }).filter(function(x) { return x !== null; });
        html += '<td class="busy">' + details.join('') + '</td>';
      }
    }
    html += '</tr>';
  }
  html += '</tbody>';
  table.innerHTML = html;
}

// ==================== SLOT SEARCH ====================
document.getElementById('searchSlotBtn').addEventListener('click', searchSlot);
document.getElementById('daySelect').addEventListener('change', searchSlot);
document.getElementById('periodSelect').addEventListener('change', searchSlot);

function searchSlot() {
  var day = document.getElementById('daySelect').value;
  var period = document.getElementById('periodSelect').value;
  var resultsSection = document.getElementById('slotResults');
  var content = document.getElementById('slotResultsContent');

  if (!day || !period) {
    resultsSection.style.display = 'none';
    return;
  }

  var d = parseInt(day);
  var p = parseInt(period);

  var freeTeachers = TEACHERS.filter(function(t) { return isFree(t, d, p); });
  var normalFree = freeTeachers.filter(function(t) { return SGDS_TEACHERS.indexOf(t.s) === -1; });
  var sgdsFree = freeTeachers.filter(function(t) { return SGDS_TEACHERS.indexOf(t.s) !== -1; });

  resultsSection.style.display = 'block';

  var html = '<div class="results-header">Day ' + day + ' Period ' + period + ' \u2014 Free Teachers (' + freeTeachers.length + '/' + TEACHERS.length + ')</div>';

  html += '<div class="results-category">';
  html += '<div class="results-category-label">Normal Teachers (' + normalFree.length + ')</div>';
  html += '<div class="results-teachers">';
  if (normalFree.length > 0) {
    html += normalFree.map(function(t) {
      return '<span class="teacher-tag normal">' + t.s + ' (' + t.e + (t.c ? ' ' + t.c : '') + ')</span>';
    }).join('');
  } else {
    html += '<span class="no-results">None</span>';
  }
  html += '</div></div>';

  html += '<div class="results-category">';
  html += '<div class="results-category-label">Student Guidance &amp; Discipline Services (' + sgdsFree.length + ')</div>';
  html += '<div class="results-teachers">';
  if (sgdsFree.length > 0) {
    html += sgdsFree.map(function(t) {
      return '<span class="teacher-tag sgds">' + t.s + ' (' + t.e + (t.c ? ' ' + t.c : '') + ')</span>';
    }).join('');
  } else {
    html += '<span class="no-results">None</span>';
  }
  html += '</div></div>';

  content.innerHTML = html;
}
</script>
